<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>灵墟 · 仙途</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306080e'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23e8c98a'%3E%E5%A2%9F%3C/text%3E%3C/svg%3E" />
    <style>
      /* 整站走暗色系：Chromium 新版一旦启用标准滚动条属性，默认浅色轨道会露出一条白边 */
      html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden;
        color-scheme: dark; scrollbar-width: thin;
        scrollbar-color: rgba(232,201,138,.42) rgba(9,13,20,.72);
        font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; }
      * { scrollbar-color: rgba(232,201,138,.42) rgba(9,13,20,.72); }

      /* ---------------- 场景层 ---------------- */
      #stage { position: fixed; inset: 0; overflow: hidden; background: #05070c; }
      #bg { position: absolute; inset: -4%; background-size: cover; background-position: center;
        background-repeat: no-repeat; will-change: transform;
        transition: opacity 380ms ease; }
      #bg.empty { background: radial-gradient(ellipse at 50% 40%, #0e1726, #05070c 70%); }
      #grade { position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 44%, rgba(4,6,11,0.5) 80%, rgba(2,3,6,0.82) 100%),
          linear-gradient(180deg, rgba(8,16,30,0.28) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 66%, rgba(3,5,9,0.5) 100%);
        mix-blend-mode: multiply; }
      #stage.fading #bg { opacity: 0.15; }

      /* ---------------- 热点 ---------------- */
      #spots { position: absolute; inset: 0; z-index: 4; }
      /* 「你在这里」单独一层：舆图左侧的落脚点不会被固定人物栏挡住半截 */
      #you-layer { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
      .spot { position: absolute; transform: translate(-50%, -50%); background: none; border: 0;
        cursor: pointer; padding: 0; }
      .spot .dot { display: block; width: 11px; height: 11px; margin: 0 auto; border-radius: 50%;
        background: rgba(255, 232, 190, 0.9);
        box-shadow: 0 0 0 6px rgba(255, 232, 190, 0.12), 0 0 22px 6px rgba(255, 214, 150, 0.45);
        animation: breathe 2.8s ease-in-out infinite; }
      @keyframes breathe { 50% { box-shadow: 0 0 0 12px rgba(255,232,190,0.05), 0 0 26px 8px rgba(255,214,150,0.3); } }
      .spot .lab { position: absolute; left: 50%; top: 22px; transform: translate(-50%, 4px);
        white-space: nowrap; padding: 5px 14px; border-radius: 999px;
        background: rgba(6, 10, 16, 0.72); border: 1px solid rgba(232, 201, 138, 0.34);
        color: #f6e7c4; font-size: 12.5px; letter-spacing: 0.14em;
        opacity: 0; transition: all 200ms ease; }
      /* 默认就淡淡地显示地名，指针移上去再亮起来（不然用户不知道能点） */
      .spot .lab { opacity: 0.72; }
      .spot:hover .lab { opacity: 1; transform: translate(-50%, 0); }

      /* 彩蛋点：没看过的在呼吸，看过的暗下去（青白一点，和"要做的事"分开） */
      .spot.egg .dot { background: rgba(206, 240, 226, 0.92);
        box-shadow: 0 0 0 6px rgba(206, 240, 226, 0.12), 0 0 22px 6px rgba(150, 220, 200, 0.42); }
      .spot.egg.seen .dot { animation: none; opacity: 0.34; }
      .spot.egg.seen .lab { opacity: 0.5; }

      /* 地图上的复古木牌 */
      .spot.plaque { transform: translate(-50%, -50%); }
      .spot.plaque .dot { display: none; }
      .spot.plaque .lab { position: relative; left: auto; top: auto; opacity: 1;
        transform: translateY(0); padding: 7px 15px; border-radius: 3px;
        background: linear-gradient(180deg, rgba(38, 28, 20, 0.9), rgba(24, 17, 12, 0.92));
        border: 1px solid rgba(206, 176, 118, 0.5);
        box-shadow: 0 3px 14px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 226, 170, 0.08);
        color: #f0d9a8; font-family: "Songti SC", "STSong", "SimSun", serif;
        font-size: 14px; letter-spacing: 0.28em; text-indent: 0.28em; }
      .spot.plaque:hover .lab { transform: translateY(-2px); border-color: rgba(232, 201, 138, 0.85); }
      .spot.plaque.done .lab { color: #ffe9b8; box-shadow: 0 0 18px rgba(255, 214, 150, 0.35); }
      /* 人就站在这块牌子上：这一块既是地点，也是"你在这里" */
      .spot.plaque.here .lab { color: #fff3d4; border-color: rgba(232, 201, 138, 0.9);
        box-shadow: 0 0 0 1px rgba(232, 201, 138, 0.28), 0 0 26px rgba(232, 201, 138, 0.22); }
      .spot.here .dot::after { content: ''; position: absolute; left: 50%; top: 50%; width: 34px; height: 34px;
        margin: -17px 0 0 -17px; border-radius: 50%; border: 1px solid rgba(232, 201, 138, 0.55);
        animation: hereRing 2.6s ease-out infinite; }
      @keyframes hereRing { 0% { transform: scale(0.45); opacity: 0.9; } 100% { transform: scale(1.5); opacity: 0; } }
      .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; color: #e8c98a; }
      .ph-title { font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 34px; letter-spacing: 0.3em; }
      .ph-text { font-size: 13px; opacity: 0.75; letter-spacing: 0.16em; }
      .ph-sub { font-size: 12px; line-height: 2; opacity: 0.45; text-align: center; letter-spacing: 0.08em; }
      .ph-sub code { color: #ffe6a8; }

      /* ---------------- HUD ---------------- */
      #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 6; display: flex;
        justify-content: space-between; align-items: flex-start; padding: 20px 26px;
        pointer-events: none; font-family: "Songti SC", "STSong", "SimSun", serif;
        color: #e8c98a; letter-spacing: 0.2em; }
      #hud .cn { font-size: 21px; text-shadow: 0 2px 14px rgba(0,0,0,0.9); }
      #hud .en { font-size: 10px; opacity: 0.55; letter-spacing: 0.32em; margin-top: 5px; }
      #merit { font-size: 13px; opacity: 0.85; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }

      /* ---------------- 底部导航 ---------------- */
      #nav { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6;
        display: flex; gap: 2px; padding: 6px; border-radius: 999px; max-width: min(1180px, 96vw);
        overflow-x: auto; scrollbar-width: none;
        background: rgba(6, 10, 16, 0.58); border: 1px solid rgba(232, 201, 138, 0.16);
        backdrop-filter: blur(8px); }
      #nav::-webkit-scrollbar { display: none; }
      #nav button { background: none; border: 0; cursor: pointer; padding: 6px 11px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto;
        color: rgba(226, 217, 200, 0.62); font-family: "Songti SC", "STSong", "SimSun", serif;
        transition: all 180ms ease; }
      #nav button b { display: block; font-size: 12.5px; letter-spacing: 0.16em; font-weight: 400; }
      #nav button span { display: block; font-size: 9.5px; letter-spacing: 0.1em; opacity: 0.5; margin-top: 2px; }
      #nav button:hover { color: #f6e7c4; background: rgba(232, 201, 138, 0.08); }
      #nav button.on { color: #14181f; background: linear-gradient(180deg, #f3dcac, #ddba7c); }
      #nav button.on span { opacity: 0.6; }
      #nav button.done b::after { content: " ·"; color: #a8d8a0; }

      #prompt { position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 6px);
        padding: 6px 15px; border-radius: 999px; opacity: 0; transition: all 200ms ease;
        background: rgba(10, 14, 21, 0.7); border: 1px solid rgba(232, 201, 138, 0.3);
        font-size: 12px; letter-spacing: 0.14em; color: #f6e7c4; pointer-events: none;
        white-space: nowrap; }
      #prompt.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------------- 穿雾转场 ---------------- */
      #fog { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0;
        transition: opacity 780ms ease;
        background:
          radial-gradient(ellipse at 50% 115%, rgba(238, 242, 245, 0.98) 0%, rgba(226, 232, 238, 0.92) 28%, rgba(214, 222, 230, 0.7) 52%, rgba(200, 210, 220, 0) 78%),
          radial-gradient(ellipse at 50% 20%, rgba(232, 238, 243, 0.55), rgba(232, 238, 243, 0) 60%); }
      #fog.in { opacity: 1; }

      /* ---------------- 面板 ---------------- */
      #panel-root { position: fixed; inset: 0; z-index: 9; display: none;
        align-items: center; justify-content: center; background: rgba(3, 5, 9, 0.6); }
      #panel-root.open { display: flex; }
      .panel { box-sizing: border-box; width: min(600px, 92vw); max-height: 84vh; overflow-x: hidden; overflow-y: auto; padding: 26px 28px 22px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(18, 24, 34, 0.97), rgba(8, 11, 17, 0.99));
        background-clip: padding-box;
        border: 1px solid rgba(232, 201, 138, 0.22); color: #e6dfd0;
        font-family: "Songti SC", "STSong", "SimSun", serif;
        box-shadow: 0 30px 80px rgba(0,0,0,0.6); animation: pop 220ms ease;
        /* 滚动条接管：不接管的话 Chromium 默认浅色轨道会在右边露出一条白边 */
        scrollbar-width: thin; scrollbar-color: rgba(232, 201, 138, 0.42) rgba(9, 13, 20, 0.72); }
      .panel::-webkit-scrollbar { width: 8px; }
      .panel::-webkit-scrollbar-track { background: rgba(9, 13, 20, 0.72); }
      .panel::-webkit-scrollbar-thumb { background: rgba(232, 201, 138, 0.32); border-radius: 8px;
        border: 2px solid transparent; background-clip: padding-box; }
      .panel::-webkit-scrollbar-thumb:hover { background: rgba(232, 201, 138, 0.55); background-clip: padding-box; }
      .panel::-webkit-scrollbar-corner { background: transparent; }
      /* 只动位移和缩放，不碰透明度：动画一旦被浏览器挂起（切后台、省电模式、动效被禁），
         面板会停在第一帧——opacity 留在 0，肉眼看不见，pointer-events 却还在，把整页点击吃掉。 */
      @keyframes pop { from { transform: translateY(10px) scale(0.985); } }
      .panel.wide { width: min(880px, 96vw); }
      .panel-title { font-size: 21px; letter-spacing: 0.14em; color: #f5e7c6; }
      .panel-title span { display: block; margin-top: 6px; font-size: 11.5px; letter-spacing: 0.1em; color: rgba(226,216,196,.48); }
      .panel-text { font-size: 14.5px; line-height: 1.95; color: rgba(226, 217, 200, 0.72); margin-top: 8px; }
      .btn { cursor: pointer; border: 0; border-radius: 999px; padding: 10px 24px; margin-top: 16px;
        font-size: 13px; letter-spacing: 0.16em;
        font-family: -apple-system, "Microsoft YaHei", sans-serif; }
      .btn.gold { background: linear-gradient(180deg, #f3dcac, #ddba7c); color: #14181f; }
      .btn.ghost { background: transparent; color: #e8c98a; border: 1px solid rgba(232,201,138,.42);
        margin-left: 8px; }
      .btn[disabled] { opacity: 0.45; cursor: default; }

      .spirit-card { position: relative; overflow: hidden; isolation: isolate;
        margin-top: 16px; padding: 16px 18px; border-radius: 10px;
        background: rgba(255,255,255,0.035); border: 1px solid rgba(232,201,138,.18); }
      .sc-root { font-size: 22px; color: #ffe6a8; letter-spacing: 0.16em; }
      .sc-meta { font-size: 12.5px; opacity: 0.72; margin-top: 8px; letter-spacing: 0.08em; }
      .sc-verdict { font-size: 13px; opacity: 0.85; margin-top: 10px; color: #cfc6b2; }

      /* ---------- 测灵根特效：五行各有光，品阶各有分量 ----------
         纯 CSS，无图片、无第三方库。--rgb 归五行，--aura/--ring 归品阶。 */
      .spirit-card.el-metal { --rgb: 230,210,154; }
      .spirit-card.el-wood  { --rgb: 143,201,138; }
      .spirit-card.el-water { --rgb: 138,182,217; }
      .spirit-card.el-fire  { --rgb: 224,138,90; }
      .spirit-card.el-earth { --rgb: 200,176,122; }
      .spirit-card.g-low    { --aura: .09; --ring: .30; --glow: 6px; }
      .spirit-card.g-mid    { --aura: .13; --ring: .42; --glow: 9px; }
      .spirit-card.g-high   { --aura: .18; --ring: .56; --glow: 13px; }
      .spirit-card.g-peak   { --aura: .23; --ring: .72; --glow: 19px; }
      .spirit-card.g-heaven { --aura: .31; --ring: .92; --glow: 28px; }
      .spirit-card.g-mixed  { --aura: .16; --ring: .58; --glow: 12px; }

      .sp-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
      .sp-body { position: relative; z-index: 1; }
      .sp-nature { margin-top: 4px; font-size: 11.5px; letter-spacing: .16em;
        color: rgba(var(--rgb), .92); }
      .sp-nature::before { content: '◇ '; opacity: .65; }

      /* 底光：所有灵根共有的呼吸，五行再各自盖一层纹理 */
      .sp-aura { position: absolute; inset: -45% -12%;
        background: radial-gradient(58% 60% at 74% 50%, rgba(var(--rgb), var(--aura)) 0%, transparent 72%);
        animation: spAura 3.4s ease-in-out infinite; }
      .sp-aura::after { content: ''; position: absolute; inset: 0; }
      @keyframes spAura { 0%,100% { opacity: .6; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.06); } }

      /* 金：一道斜刃扫过 */
      .el-metal .sp-aura::after { background: linear-gradient(115deg, transparent 43%, rgba(var(--rgb),.20) 50%, transparent 57%);
        transform: translateX(-120%); animation: spSheen 3.2s linear infinite; }
      @keyframes spSheen { 0% { transform: translateX(-120%); } 60%,100% { transform: translateX(120%); } }
      /* 木：从底下慢慢长上来的绿意 */
      .el-wood .sp-aura { background: radial-gradient(70% 80% at 74% 100%, rgba(var(--rgb), var(--aura)) 0%, transparent 72%);
        animation: spBreathe 4.6s ease-in-out infinite; }
      @keyframes spBreathe { 0%,100% { opacity: .45; transform: translateY(6%); } 50% { opacity: 1; transform: translateY(-4%); } }
      /* 水：横向水纹 */
      .el-water .sp-aura::after { background: repeating-linear-gradient(0deg, transparent 0 11px, rgba(var(--rgb),.11) 11px 12px);
        animation: spRipple 5s linear infinite; }
      @keyframes spRipple { from { transform: translateY(0); } to { transform: translateY(12px); } }
      /* 火：火头一跳一跳 */
      .el-fire .sp-aura { background: radial-gradient(62% 72% at 74% 100%, rgba(var(--rgb), var(--aura)) 0%, transparent 70%);
        animation: spFlicker 1.1s ease-in-out infinite alternate; }
      @keyframes spFlicker { from { opacity: .5; transform: scaleY(.9); } to { opacity: 1; transform: scaleY(1.08); } }
      /* 土：沉下去，几乎不动 */
      .el-earth .sp-aura { animation: spSettle 5.6s ease-in-out infinite; }
      .el-earth .sp-aura::after { background: linear-gradient(0deg, rgba(var(--rgb),.10), transparent 38%); }
      @keyframes spSettle { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
      /* 杂灵根：五色搅在一处，单独一档 */
      .g-mixed .sp-aura {
        background:
          radial-gradient(32% 38% at 62% 40%, rgba(230,210,154,.16), transparent 70%),
          radial-gradient(32% 38% at 80% 38%, rgba(143,201,138,.16), transparent 70%),
          radial-gradient(32% 38% at 84% 64%, rgba(138,182,217,.16), transparent 70%),
          radial-gradient(32% 38% at 68% 72%, rgba(224,138,90,.16), transparent 70%),
          radial-gradient(32% 38% at 56% 58%, rgba(200,176,122,.16), transparent 70%);
        animation: spAura 5.6s ease-in-out infinite; }
      /* 圆形 + 径向遮罩：转起来也不会把矩形边缘露进卡片 */
      .g-mixed .sp-aura::after { inset: auto; left: 70%; top: 50%;
        width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(230,210,154,.15), rgba(143,201,138,.15),
          rgba(138,182,217,.15), rgba(224,138,90,.15), rgba(200,176,122,.15), rgba(230,210,154,.15));
        -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,.9) 12%, transparent 72%);
        mask-image: radial-gradient(circle, rgba(0,0,0,.9) 12%, transparent 72%);
        animation: spMixed 16s linear infinite; }
      .g-mixed .sp-nature::after { content: ' · 旁枝并旺'; opacity: .8; }
      @keyframes spMixed { to { transform: rotate(360deg); } }

      /* 灵纹：右侧转环 + 五行字；品阶越高越亮，天灵根转得更快 */
      .sp-seal { position: absolute; right: -30px; top: 50%; width: 146px; height: 146px; margin-top: -73px;
        display: grid; place-items: center; opacity: var(--ring); }
      .sp-ring, .sp-ring2 { position: absolute; inset: 0; border-radius: 50%;
        border: 1px dashed rgba(var(--rgb), .38); animation: spSpin 18s linear infinite; }
      .sp-ring2 { inset: 19px; border-style: solid; border-color: rgba(var(--rgb), .16);
        animation-direction: reverse; animation-duration: 12s; }
      @keyframes spSpin { to { transform: rotate(360deg); } }
      .sp-seal b { font: 400 58px/1 serif; color: rgba(var(--rgb), .26);
        text-shadow: 0 0 var(--glow) rgba(var(--rgb), .5); }
      .g-mixed .sp-ring { border-style: dotted; }
      .g-mixed .sp-seal b { color: rgba(var(--rgb), .42); font-size: 52px; }
      .g-heaven .sp-ring { animation-duration: 9s; }
      .g-heaven .root { animation: spHeaven 3s ease-in-out infinite; }
      @keyframes spHeaven { 0%,100% { text-shadow: 0 0 8px rgba(var(--rgb), .3); }
        50% { text-shadow: 0 0 22px rgba(var(--rgb), .8), 0 0 44px rgba(var(--rgb), .35); } }

      /* 灵尘：五行飘法不同（--dx/--dy），品阶只管数量 */
      .sp-motes { position: absolute; inset: 0; }
      .sp-motes i { position: absolute; bottom: -8px; width: 3px; height: 3px; border-radius: 50%;
        background: rgba(var(--rgb), .85); box-shadow: 0 0 8px 2px rgba(var(--rgb), .4); opacity: 0;
        animation: spFloat 3s ease-in infinite; }
      .el-metal .sp-motes { --dx: -26px; --dy: -96px; }
      .el-wood  .sp-motes { --dx: 8px;   --dy: -156px; }
      .el-water .sp-motes { --dx: 42px;  --dy: -76px; }
      .el-fire  .sp-motes { --dx: -6px;  --dy: -176px; }
      .el-earth .sp-motes { --dx: 2px;   --dy: -44px; }
      @keyframes spFloat { 0% { opacity: 0; transform: translate(0,0) scale(.6); }
        22% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx, 8px), var(--dy, -120px)) scale(1.1); } }

      /* 按手那一下：显影 + 灵光爆闪（JS 只在刚测出时加 is-reveal） */
      .sp-flash { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(circle at 74% 50%, rgba(255,255,255,.5), rgba(var(--rgb), .4) 34%, transparent 70%); }
      .spirit-card.is-reveal { animation: spReveal .9s cubic-bezier(.2,.8,.2,1) both; }
      .is-reveal .sp-flash { animation: spFlash 1.1s ease-out both; }
      @keyframes spReveal { 0% { opacity: 0; transform: translateY(12px) scale(.97); filter: blur(6px); }
        60% { filter: blur(0); } 100% { opacity: 1; transform: none; } }
      @keyframes spFlash { 0% { opacity: 0; } 18% { opacity: .85; } 100% { opacity: 0; } }

      /* 测灵石前那颗按钮：未测之前轻轻招手 */
      #roll { animation: rollCall 2.6s ease-in-out infinite; }
      @keyframes rollCall { 0%,100% { box-shadow: 0 0 0 rgba(232,201,138,0); }
        50% { box-shadow: 0 0 22px 3px rgba(232,201,138,.32); } }

      @media (max-width: 700px) { .sp-seal { right: -46px; opacity: calc(var(--ring) * .5); } }
      @media (prefers-reduced-motion: reduce) {
        .sp-aura, .sp-aura::after, .sp-ring, .sp-ring2, .sp-motes i,
        .g-heaven .root, #roll, .spirit-card.is-reveal, .is-reveal .sp-flash { animation: none !important; }
      }

      .brew-bar { position: relative; height: 16px; margin: 22px 0 8px; border-radius: 8px; overflow: hidden;
        background: rgba(255,255,255,.06); border: 1px solid rgba(232,201,138,.16); }
      .brew-zone { position: absolute; top: 0; bottom: 0; background: rgba(255,206,120,.26); }
      .brew-marker { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #ffe6a8;
        box-shadow: 0 0 10px rgba(255,230,168,.9); }
      .shake { animation: shake .28s; }
      @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

      .swords { display: flex; gap: 10px; margin: 18px 0 4px; }
      .sword { flex: 1; cursor: pointer; padding: 16px 12px; border-radius: 10px; text-align: left;
        background: rgba(255,255,255,.03); border: 1px solid rgba(232,201,138,.2); color: #e6dfd0;
        font-family: inherit; transition: all 160ms ease; }
      .sword:hover { border-color: rgba(232,201,138,.7); background: rgba(232,201,138,.09); }
      .sword.picked { border-color: rgba(255,214,140,.8); background: rgba(255,214,140,.12); }
      .sword b { display: block; font-size: 16px; color: #f5e7c6; margin-bottom: 6px; letter-spacing: .1em; }
      .sword span { font-size: 12px; opacity: .7; line-height: 1.7; }

      .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px auto 6px;
        width: 100%; max-width: 400px; }
      .tile { aspect-ratio: 1.25; cursor: pointer; border-radius: 8px; font-size: 22px; color: #e8c98a;

      /* 用掉的那一刻：半秒钟，不要面板，不要按钮 */
      .moment { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        pointer-events: none; z-index: 95; opacity: 0; transition: opacity 0.18s ease; }
      .moment.on { opacity: 1; }
      .moment .m-inner { text-align: center; padding: 0 28px; }
      .moment .m-title { font-size: 19px; letter-spacing: 0.3em; color: #f5e7c6; }
      .moment .m-line { margin-top: 11px; font-size: 12px; line-height: 2; letter-spacing: 0.08em;
        color: rgba(226, 217, 200, 0.62); }
      .moment.m-pill .m-inner { animation: mPill 0.62s ease forwards; }
      .moment.m-array .m-inner { animation: mPill 0.62s ease forwards; }
      .moment.m-burn .m-inner { animation: mBurn 0.62s ease forwards; }
      .moment.m-crack .m-inner { animation: mCrack 0.62s ease forwards; }
      .moment.m-burn .m-title { color: #efb083; }
      .moment.m-crack .m-title { color: #cfc7b4; }
      @keyframes mPill {
        0% { opacity: 0; transform: translateY(10px) scale(0.96); }
        35% { opacity: 1; transform: none; }
        100% { opacity: 0.9; transform: translateY(-4px); }
      }
      @keyframes mBurn {
        0% { opacity: 0; filter: blur(3px); }
        30% { opacity: 1; filter: blur(0); text-shadow: 0 0 18px rgba(255, 150, 80, 0.5); }
        100% { opacity: 0.85; }
      }
      @keyframes mCrack {
        0% { opacity: 0; transform: scale(1.05); }

      /* ---------------------------- 人命斗法 ---------------------------- */
      #duel { position: fixed; inset: 0; z-index: 60; display: none; }

      .dl-bg { position: absolute; inset: 0; background:
        radial-gradient(120% 90% at 50% 30%, rgba(10,14,20,.28), rgba(2,3,6,.84) 70%),
        linear-gradient(180deg, rgba(6,9,14,.86), rgba(2,3,6,.96)); }
      .dl-foe, .dl-me { position: absolute; left: 0; right: 0; display: flex; align-items: flex-end; gap: 18px; padding: 0 6vw; }
      .dl-foe { top: 6vh; justify-content: flex-end; }
      .dl-me { bottom: 30vh; justify-content: flex-start; }
      .dl-me { flex-direction: row; }
      .dl-foe-shot img { width: 260px; height: 340px; object-fit: cover; border-radius: 6px;

      .dl-foe-shot { width: 230px; height: 300px; display: block; }
      .dl-blank { width: 230px; height: 300px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(80% 70% at 50% 40%, rgba(40,34,26,.9), rgba(12,14,18,.9));
        border: 1px solid rgba(232,201,138,.18); }
      .dl-shadow { position: relative; width: 240px; height: 320px; display: flex; align-items: flex-end; justify-content: center;
        background: radial-gradient(58% 46% at 50% 46%, rgba(148,158,172,.26), rgba(128,138,152,.10) 55%, transparent 74%); }
      .dl-shadow::after { content: ''; position: absolute; inset: 6% 4% 2% 4%; border-radius: 50%;
        background: radial-gradient(60% 55% at 50% 62%, rgba(120,20,18,.20), transparent 70%);
        filter: blur(14px); }
      .dl-shadow-fig { width: 208px !important; height: auto !important; transform: scaleX(-1);
        filter: brightness(.28) contrast(1.45) drop-shadow(0 0 18px rgba(0,0,0,.9))
                drop-shadow(0 0 2px rgba(190,205,225,.35));
        opacity: .98; }
      .dl-shadow::before { content: ''; position: absolute; left: 50%; top: 15.5%; width: 26px; height: 8px;
        transform: translateX(-50%); border-radius: 4px; z-index: 3;
        background: radial-gradient(circle at 26% 50%, rgba(226,74,58,.95) 0 2.4px, transparent 3px),
                    radial-gradient(circle at 74% 50%, rgba(226,74,58,.95) 0 2.4px, transparent 3px);

      .dl-me-shot img, .dl-me-shot canvas { width: 150px; height: 240px; object-fit: contain; filter: drop-shadow(0 10px 26px rgba(0,0,0,.85)); }
      .dl-foe-meta, .dl-me-meta { display: flex; flex-direction: column; gap: 4px; }

      .dl-me-meta b { color: #b9d3e8; }

        border: 1px solid rgba(255,255,255,.08); overflow: hidden; }

      .dl-hp.foe i { background: linear-gradient(90deg, #8d2b2b, #d8503f); }
      .dl-hp.me { width: 240px; left: 6vw; bottom: -18px; }

      /* 身份色：业债红、同门青、山匪黄、赏金赤、心魔紫 */
      #duel.kind-grudge .dl-shadow { background: radial-gradient(58% 46% at 50% 46%, rgba(168,44,40,.30), rgba(90,20,18,.12) 55%, transparent 74%); }

      /* 收招：赢 —— 对手淡进去、剑光扫过；输 —— 剪影倒下去 */
      .dl-foe.die { transition: opacity .7s ease, transform .7s ease, filter .7s ease;

      .dl-me.down { transition: transform .75s cubic-bezier(.4,0,.9,.6), filter .75s ease;

      .dl-slash { position: absolute; left: 50%; top: 34%; width: 74vw; height: 3px; z-index: 55;

        box-shadow: 0 0 26px 8px rgba(255,240,200,.55);

      @keyframes dlSlash { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-14deg) scaleX(.2); }
        30% { opacity: 1; transform: translate(-50%,-50%) rotate(-14deg) scaleX(1.05); }
        100% { opacity: 0; transform: translate(-50%,-50%) rotate(-14deg) scaleX(1.15); } }
      .dl-float { position: absolute; font-size: 22px; font-weight: 700; color: #ffd9a0; pointer-events: none;

      .dl-float.bad { color: #ff8f7a; }

      @keyframes dlFloat { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -60px); } }

    .dc-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .dc-top { position: absolute; top: 4.4vh; left: 50%; transform: translateX(-50%);
      width: min(720px, 62vw); text-align: center; }
    .dc-foe-name { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
    .dc-foe-name b { font-size: 21px; letter-spacing: .06em; color: #f3e6c8; }
    .dc-foe-name span { font-size: 12px; opacity: .55; letter-spacing: .04em; }
    .dc-foe-hp { position: relative; height: 9px; margin-top: 8px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; }
    .dc-foe-hp i { position: absolute; inset: 0 auto 0 0; width: 100%;
      background: linear-gradient(180deg, #e06a5a, #9d2f2a); border-radius: 6px;
      transition: width .28s ease; }
    .dc-foe-hp b { position: absolute; right: -4px; top: 14px; font-size: 12px; font-weight: 400; opacity: .75;
      color: #f0d9b6; letter-spacing: .04em; }
    .dc-telegraph { margin-top: 26px; height: 18px; font-size: 12.5px; letter-spacing: .08em;
      color: #ff9a72; opacity: 0; transition: opacity .2s; }
    .dc-telegraph.on { opacity: 1; animation: dcTele 1.1s ease-in-out infinite; }
    @keyframes dcTele { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    .dc-foe-fig { position: absolute; right: 9vw; top: 20vh; width: 260px; height: 380px;
      display: flex; align-items: flex-end; justify-content: center;
      background: radial-gradient(58% 46% at 50% 52%, rgba(150,160,175,.24), rgba(120,130,150,.08) 58%, transparent 76%); }
    .dc-me-fig { position: absolute; left: 8vw; bottom: 21vh; width: 220px; height: 330px;
      display: flex; align-items: flex-end; justify-content: center;
      background: radial-gradient(56% 46% at 50% 55%, rgba(140,160,190,.16), transparent 72%); }
    .dc-sil { width: 100% !important; height: auto !important; display: block;
      filter: brightness(.4) contrast(1.35) drop-shadow(0 0 18px rgba(0,0,0,.9))
              drop-shadow(0 0 2px rgba(190,205,225,.32)); }
    .dc-sil.foe { transform: scaleX(-1); width: 100% !important; }
    .dc-portrait { width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 26px rgba(0,0,0,.85)); }

    .dc-foe-fig::before { content: ""; position: absolute; top: 22px; left: 50%; width: 46px; height: 12px;
      transform: translateX(-50%);
      background: radial-gradient(circle at 22% 50%, #ff4b3a 0 3.2px, transparent 4px),
                  radial-gradient(circle at 78% 50%, #ff4b3a 0 3.2px, transparent 4px);
      opacity: .9; filter: blur(.2px) drop-shadow(0 0 8px rgba(255,60,40,.9)); }
    .dc-foe-fig::after { content: ""; position: absolute; inset: -10% -18% 0; pointer-events: none;
      background: radial-gradient(60% 52% at 50% 50%, rgba(120,10,10,.2), transparent 72%); }
    .dc-foe-fig.kind-bounty::after { background: radial-gradient(60% 52% at 50% 50%, rgba(170,20,10,.26), transparent 72%); }
    .dc-foe-fig.kind-peer::after { background: radial-gradient(60% 52% at 50% 50%, rgba(30,110,140,.24), transparent 72%); }
    .dc-foe-fig.kind-bandit::after { background: radial-gradient(60% 52% at 50% 50%, rgba(150,120,20,.22), transparent 72%); }
    .dc-foe-fig.kind-demon::after { background: radial-gradient(60% 52% at 50% 50%, rgba(110,40,160,.30), transparent 72%); }
    .dc-foe-fig.kind-grudge::after { background: radial-gradient(60% 52% at 50% 50%, rgba(180,20,20,.30), transparent 72%); }

    .dc-me-panel { position: absolute; left: 7vw; bottom: 8.5vh; width: 264px;
      padding: 10px 12px; border: 1px solid rgba(232,201,138,.18); border-radius: 10px;
      background: rgba(8,11,16,.66); }
    .dc-me-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .dc-me-top b { font-size: 17px; letter-spacing: .05em; color: #f2e8d2; }
    .dc-me-top span { font-size: 11px; opacity: .5; }
    .dc-bar-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .dc-bar-row .lbl { font-size: 10px; opacity: .45; width: 24px; flex: none; letter-spacing: .04em; }
    .dc-bar-row .val { font-size: 10px; opacity: .7; width: 56px; text-align: right; flex: none;
      font-variant-numeric: tabular-nums; }
    .dc-bar { position: relative; flex: 1; height: 8px; margin-top: 6px; border-radius: 5px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); overflow: hidden; }
    .dc-bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .26s ease; }
    .dc-bar.hp i { background: linear-gradient(180deg, #7fc58a, #3d7a48); }
    .dc-bar.mp i { background: linear-gradient(180deg, #7cb6e8, #2f5f96); }

    .dc-buffs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; min-height: 16px; }
    .dc-chip { font-size: 10.5px; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px;
      border: 1px solid rgba(232,201,138,.4); color: #e8c98a; }
    .dc-chip.shield { border-color: rgba(226,196,120,.6); }
    .dc-chip.dodge { border-color: rgba(150,220,200,.55); color: #a8e0d0; }
    .dc-chip.dot { border-color: rgba(255,140,90,.6); color: #ffb08a; }

    .dc-feed { position: absolute; left: 50%; bottom: 15.5vh; transform: translateX(-50%);
      width: min(620px, 52vw); text-align: center; }
    .dc-line { font-size: 13.5px; line-height: 1.9; letter-spacing: .03em; color: rgba(232,226,214,.72);
      animation: dcLine .28s ease both; }
    .dc-line.bad { color: #ff9d86; }
    .dc-line.good { color: #a9dcb4; }
    .dc-line.win { color: #f0d59a; }
    .dc-line.lose { color: #e88b8b; }
    @keyframes dcLine { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .dc-turn { position: absolute; left: 50%; bottom: 25vh; transform: translateX(-50%);
      font-size: 11px; letter-spacing: .28em; color: rgba(232,201,138,.9); opacity: 0;
      transition: opacity .2s; text-shadow: 0 0 12px rgba(232,201,138,.35); }
    .dc-turn.on { opacity: .9; }
    .dc-skills { position: absolute; left: 57%; bottom: 3.4vh; transform: translateX(-50%);
      display: flex; gap: 9px; align-items: flex-end; }
    .dc-skill { position: relative; width: 104px; height: 66px; padding: 6px 7px;
      display: flex; flex-direction: column; justify-content: space-between; text-align: left;
      border: 1px solid rgba(232,201,138,.26); border-radius: 8px; cursor: pointer;
      background: linear-gradient(180deg, rgba(26,32,42,.94), rgba(12,15,21,.94)); color: #e6dfd1;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; }
    .dc-skill:hover { transform: translateY(-3px); border-color: rgba(232,201,138,.7);
      box-shadow: 0 6px 20px rgba(0,0,0,.45); }
    .dc-skill.off { opacity: .42; cursor: default; filter: grayscale(.6); }
    .dc-skill.off:hover { transform: none; box-shadow: none; }
    .dc-key { position: absolute; top: 4px; right: 6px; font-size: 10px; opacity: .45; }
    .dc-elem { align-self: flex-start; font-size: 10px; padding: 0 4px; border-radius: 3px;
      border: 1px solid currentColor; opacity: .95; }
    .dc-elem.metal { color: #ffe096; }
    .dc-elem.wood { color: #8ce696; }
    .dc-elem.water { color: #78beff; }
    .dc-elem.fire { color: #ff8c46; }
    .dc-elem.earth { color: #cdaa6e; }
    .dc-elem.thunder { color: #bec8ff; }
    .dc-elem.wind { color: #c8f0e6; }
    .dc-name { font-size: 12.5px; letter-spacing: .04em; }
    .dc-cost { font-size: 10px; opacity: .58; }
    .dc-cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; background: rgba(0,0,0,.55); border-radius: 8px; }
    .dc-basic { border-color: rgba(200,210,230,.22); }

    .dc-float { position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
      font-size: 26px; font-weight: 600; letter-spacing: .02em; pointer-events: none;
      text-shadow: 0 2px 12px rgba(0,0,0,.9); animation: dcFloat .95s ease-out forwards; }
    .dc-float.hit { color: #ffd7a8; }
    .dc-float.crit { color: #ff8a5c; font-size: 34px; }
    .dc-float.dot { color: #ffb08a; font-size: 20px; }
    .dc-float.heal { color: #a9e8b4; }
    .dc-float.shield { color: #f0d59a; font-size: 18px; }
    .dc-float.good { color: #bfe8c8; font-size: 18px; }
    @keyframes dcFloat { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); }
      22% { opacity: 1; transform: translate(-50%, -6px) scale(1.05); }
      100% { opacity: 0; transform: translate(-50%, -46px) scale(.96); } }

    .dc-foe-fig.hurt, .dc-me-fig.hurt { animation: dcHurt .32s ease; }
    @keyframes dcHurt { 0%,100% { transform: none; filter: none; }
      25% { transform: translateX(8px) rotate(1.2deg); filter: brightness(2.2) saturate(0); }
      60% { transform: translateX(-6px); filter: brightness(1.4); } }
    .dc-foe-fig.die { animation: dcDie .8s ease forwards; }
    @keyframes dcDie { to { opacity: 0; transform: translateY(26px) scale(.92); filter: blur(6px) brightness(.4); } }
    .dc-me-fig.down { animation: dcDown .8s ease forwards; }
    @keyframes dcDown { to { transform: rotate(74deg) translateY(40px); opacity: .55; filter: grayscale(.9); } }

    .dc-flash { position: absolute; inset: 0; pointer-events: none; animation: dcFlash .3s ease-out forwards; }
    @keyframes dcFlash { from { opacity: 1; } to { opacity: 0; } }
    #duel.dc-shake .dc-scene, #duel.dc-shake .dc-foe-fig, #duel.dc-shake .dc-me-fig {
      animation: dcShake .26s ease; }
    @keyframes dcShake { 0%,100% { transform: none; } 25% { transform: translate(6px,-4px); }
      55% { transform: translate(-5px,3px); } 80% { transform: translate(3px,2px); } }

    @media (max-width: 860px) {
      .dc-foe-fig { right: 3vw; top: 24vh; width: 170px; height: 250px; }
      .dc-me-fig { left: 2vw; width: 150px; height: 220px; }
      .dc-skills { gap: 6px; bottom: 2vh; }
      .dc-skill { width: 78px; height: 56px; }
      .dc-name { font-size: 11px; }
      .dc-feed { width: 84vw; bottom: 19vh; }
      .dc-me-panel { left: 2vw; width: 210px; }
    }
        /* ===== 斗法 v2.1 增补：词条 / 架势 / 法宝 ===== */
    .dc-traits { font-size: 9.5px; letter-spacing: .04em; color: rgba(232,201,138,.72); white-space: nowrap; }
    .dc-skill { height: 76px; }
    .dc-stance-row { position: absolute; left: 50%; bottom: 15.4vh; transform: translateX(-50%);
      display: flex; gap: 8px; }
    .dc-stance { padding: 4px 14px; font-size: 12.5px; letter-spacing: .14em; cursor: pointer;
      color: rgba(232,226,214,.62); background: rgba(10,13,19,.72);
      border: 1px solid rgba(232,201,138,.2); border-radius: 20px;
      transition: color .15s, border-color .15s, background .15s; font-family: inherit; }
    .dc-stance:hover { color: #f0d59a; border-color: rgba(232,201,138,.5); }
    .dc-stance.on { color: #10130f; background: linear-gradient(180deg, #f0d59a, #d8b46a);
      border-color: #f0d59a; box-shadow: 0 0 16px rgba(232,201,138,.28); }
    .dc-foe-stance { font-style: normal; font-size: 11px; letter-spacing: .14em;
      color: #ffb08a; border: 1px solid rgba(255,150,110,.4); border-radius: 10px; padding: 0 7px; }
    .dc-chip.stance { border-color: rgba(200,210,230,.45); color: #c8d2e6; }
    .dc-items { position: absolute; right: 3vw; bottom: 3.4vh; display: flex; gap: 8px; }
    .dc-item { width: 58px; height: 52px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; cursor: pointer; font-family: inherit;
      color: #e6dfd1; background: linear-gradient(180deg, rgba(26,32,42,.94), rgba(12,15,21,.94));
      border: 1px solid rgba(200,170,110,.3); border-radius: 8px; font-size: 13px; letter-spacing: .1em; }
    .dc-item b { font-size: 11px; font-weight: 400; color: #f0d59a; }
    .dc-item:hover { border-color: rgba(232,201,138,.7); transform: translateY(-2px); }
    .dc-item.off { opacity: .35; cursor: default; filter: grayscale(.7); }
    .dc-item.off:hover { transform: none; }
    .dc-skills { left: 52%; }
    .dc-feed { bottom: 20.2vh; }
    @media (max-width: 860px) {
      .dc-skill { height: 62px; }
      .dc-traits { display: none; }
      .dc-stance-row { bottom: 15vh; }
      .dc-items { right: 2vw; bottom: 1.6vh; }
      .dc-item { width: 46px; height: 42px; font-size: 12px; }
    }
    </style>
  </head>
  <body>
    <a id="back-map" class="back-map" href="#" hidden>‹ 回舆图 · Esc</a>
    <div id="map-dock" hidden>
      <div class="dock-card">
        <div class="dock-goal"><b id="dock-rank">练气</b><span id="dock-left">寿元 64</span></div>
        <div class="dock-sep"></div>
        <div class="dock-goal"><span>渡劫四事</span><span class="dock-dots" id="dock-dots"></span></div>
        <div class="dock-sep"></div>
        <div id="dock-next" aria-label="下一步指引"><span id="dock-next-label">下一步</span><small id="dock-next-sub"></small></div>
      </div>
      <button id="btn-year">静修一年</button>
      <button id="walk-out" hidden>出门走走 · 一年</button>
    </div>

    <div id="stage"><div id="bg" class="empty"></div><div id="spots"></div></div>
    <div id="you-layer"></div>
    <div id="grade"></div>
    <div id="hud">
      <div>
        <div class="cn">灵墟</div>
        <div class="en">LINGXU · 仙途</div>
      </div>
      <div id="hud-right">
        <div id="hud-line"><span id="r-age">年 16</span><span id="r-left">寿元 80</span></div>
        <div id="merit">道行 0 · 练气</div>
        <div id="hud-btns">
          <button id="btn-bio">人物</button>
          <button id="btn-mind">心事</button>
          <button id="btn-bag">袋子</button>
          <button id="btn-sect">宗门</button>
          <button id="btn-travel">出门</button>
          <button id="btn-world">天时</button>
          <button id="btn-folk">人</button>
          <button id="btn-break">破境</button>
          <button id="btn-mount">坐骑</button>
          <button id="btn-codex">图鉴</button>
          <button id="btn-archive">命簿</button>
        </div>
      </div>
    </div>
    <!-- 左上角：像素头像 + 气血 + 年岁 -->
    <div id="vitalcard">
      <div class="vc-row">
        <div id="vc-avatar"></div>
        <div class="vc-main">
          <div class="vc-name" id="vc-name">无名</div>
          <div class="vc-sub"><span id="vc-root">尚未测灵根</span><i>·</i><span id="vc-rank">练气</span></div>
        </div>
      </div>
      <div class="vc-hp"><i id="vc-hpbar"></i></div>
      <div class="vc-bot"><span id="vc-hp">— / —</span><em id="vc-year">年 16</em></div>
    </div>
    <div id="prompt"></div>
    <div id="nav"></div>
    <div id="panel-root"></div>
    <div id="fog"></div>

    <!-- 入场动画：山门石阶·第一人称推进（已去水印，H.264） -->
    <div id="intro">
      <video id="intro-video" muted playsinline preload="auto"
             poster="./assets/video/intro-a-poster.jpg?v=2" src="./assets/video/intro-a.mp4?v=2"></video>
      <div class="intro-shade"></div>
      <div class="intro-title">
        <div class="it-cn">灵墟</div>
        <div class="it-line"></div>
        <div class="it-sub">入此墟者 · 各凭灵根</div>
      </div>
      <button id="intro-skip">跳过 ▸</button>
    </div>

    <div id="toast"></div>
    <!-- 年结：这一格换来了什么 -->
    <div id="year-result"></div>
    <!-- 场景里被人叫住：不打断探索，也不弹大面板 -->
    <div id="mind-call">
      <div class="mc-who" id="mc-who"></div>
      <div class="mc-line" id="mc-line"></div>
      <div class="mc-acts" id="mc-acts"></div>
    </div>

    <!-- 左边这一栏：有关系、有托付的人排在前头 -->
    <button id="people-toggle" type="button" aria-expanded="true" aria-controls="people-rail">人物 ‹</button>
    <aside id="people-rail">
      <div class="pr-head">人物 <em id="pr-party"></em></div>
      <div class="pr-stat" id="pr-stat"></div>
      <div class="pr-events" id="pr-events"></div>
      <div id="people-list"></div>
      <div class="pr-foot">点一个人，看看他是谁</div>
    </aside>
    <script type="module" src="./scenes.js"></script>
  </body>
</html>
