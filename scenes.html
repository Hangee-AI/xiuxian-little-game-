<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>灵墟 · 仙途</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden;
        font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; }

      /* ---------------- 场景层 ---------------- */
      #stage { position: fixed; inset: 0; overflow: hidden; background: #05070c; }
      #bg { position: absolute; inset: -4%; background-size: cover; background-position: center;
        background-repeat: no-repeat; will-change: transform;
        transition: opacity 380ms ease; }
      #bg.empty { background: radial-gradient(ellipse at 50% 40%, #0e1726, #05070c 70%); }
      #grade { position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 44%, rgba(4,6,11,0.5) 80%, rgba(2,3,6,0.82) 100%),
          linear-gradient(180deg, rgba(8,16,30,0.28) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 66%, rgba(3,5,9,0.5) 100%);
        mix-blend-mode: multiply; }
      #stage.fading #bg { opacity: 0.15; }

      /* ---------------- 热点 ---------------- */
      #spots { position: absolute; inset: 0; z-index: 4; }
      .spot { position: absolute; transform: translate(-50%, -50%); background: none; border: 0;
        cursor: pointer; padding: 0; }
      .spot .dot { display: block; width: 11px; height: 11px; margin: 0 auto; border-radius: 50%;
        background: rgba(255, 232, 190, 0.9);
        box-shadow: 0 0 0 6px rgba(255, 232, 190, 0.12), 0 0 22px 6px rgba(255, 214, 150, 0.45);
        animation: breathe 2.8s ease-in-out infinite; }
      @keyframes breathe { 50% { box-shadow: 0 0 0 12px rgba(255,232,190,0.05), 0 0 26px 8px rgba(255,214,150,0.3); } }
      .spot .lab { position: absolute; left: 50%; top: 22px; transform: translate(-50%, 4px);
        white-space: nowrap; padding: 5px 14px; border-radius: 999px;
        background: rgba(6, 10, 16, 0.72); border: 1px solid rgba(232, 201, 138, 0.34);
        color: #f6e7c4; font-size: 12.5px; letter-spacing: 0.14em;
        opacity: 0; transition: all 200ms ease; }
      /* 默认就淡淡地显示地名，指针移上去再亮起来（不然用户不知道能点） */
      .spot .lab { opacity: 0.72; }
      .spot:hover .lab { opacity: 1; transform: translate(-50%, 0); }

      /* 彩蛋点：没看过的在呼吸，看过的暗下去（青白一点，和"要做的事"分开） */
      .spot.egg .dot { background: rgba(206, 240, 226, 0.92);
        box-shadow: 0 0 0 6px rgba(206, 240, 226, 0.12), 0 0 22px 6px rgba(150, 220, 200, 0.42); }
      .spot.egg.seen .dot { animation: none; opacity: 0.34; }
      .spot.egg.seen .lab { opacity: 0.5; }

      /* 地图上的复古木牌 */
      .spot.plaque { transform: translate(-50%, -50%); }
      .spot.plaque .dot { display: none; }
      .spot.plaque .lab { position: relative; left: auto; top: auto; opacity: 1;
        transform: translateY(0); padding: 7px 15px; border-radius: 3px;
        background: linear-gradient(180deg, rgba(38, 28, 20, 0.9), rgba(24, 17, 12, 0.92));
        border: 1px solid rgba(206, 176, 118, 0.5);
        box-shadow: 0 3px 14px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 226, 170, 0.08);
        color: #f0d9a8; font-family: "Songti SC", "STSong", "SimSun", serif;
        font-size: 14px; letter-spacing: 0.28em; text-indent: 0.28em; }
      .spot.plaque:hover .lab { transform: translateY(-2px); border-color: rgba(232, 201, 138, 0.85); }
      .spot.plaque.done .lab { color: #ffe9b8; box-shadow: 0 0 18px rgba(255, 214, 150, 0.35); }
      .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; color: #e8c98a; }
      .ph-title { font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 34px; letter-spacing: 0.3em; }
      .ph-text { font-size: 13px; opacity: 0.75; letter-spacing: 0.16em; }
      .ph-sub { font-size: 12px; line-height: 2; opacity: 0.45; text-align: center; letter-spacing: 0.08em; }
      .ph-sub code { color: #ffe6a8; }

      /* ---------------- HUD ---------------- */
      #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 6; display: flex;
        justify-content: space-between; align-items: flex-start; padding: 20px 26px;
        pointer-events: none; font-family: "Songti SC", "STSong", "SimSun", serif;
        color: #e8c98a; letter-spacing: 0.2em; }
      #hud .cn { font-size: 21px; text-shadow: 0 2px 14px rgba(0,0,0,0.9); }
      #hud .en { font-size: 10px; opacity: 0.55; letter-spacing: 0.32em; margin-top: 5px; }
      #merit { font-size: 13px; opacity: 0.85; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }

      /* ---------------- 底部导航 ---------------- */
      #nav { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6;
        display: flex; gap: 2px; padding: 6px; border-radius: 999px; max-width: min(1180px, 96vw);
        overflow-x: auto; scrollbar-width: none;
        background: rgba(6, 10, 16, 0.58); border: 1px solid rgba(232, 201, 138, 0.16);
        backdrop-filter: blur(8px); }
      #nav::-webkit-scrollbar { display: none; }
      #nav button { background: none; border: 0; cursor: pointer; padding: 6px 11px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto;
        color: rgba(226, 217, 200, 0.62); font-family: "Songti SC", "STSong", "SimSun", serif;
        transition: all 180ms ease; }
      #nav button b { display: block; font-size: 12.5px; letter-spacing: 0.16em; font-weight: 400; }
      #nav button span { display: block; font-size: 9.5px; letter-spacing: 0.1em; opacity: 0.5; margin-top: 2px; }
      #nav button:hover { color: #f6e7c4; background: rgba(232, 201, 138, 0.08); }
      #nav button.on { color: #14181f; background: linear-gradient(180deg, #f3dcac, #ddba7c); }
      #nav button.on span { opacity: 0.6; }
      #nav button.done b::after { content: " ·"; color: #a8d8a0; }

      #prompt { position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 6px);
        padding: 6px 15px; border-radius: 999px; opacity: 0; transition: all 200ms ease;
        background: rgba(10, 14, 21, 0.7); border: 1px solid rgba(232, 201, 138, 0.3);
        font-size: 12px; letter-spacing: 0.14em; color: #f6e7c4; pointer-events: none;
        white-space: nowrap; }
      #prompt.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------------- 穿雾转场 ---------------- */
      #fog { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0;
        transition: opacity 780ms ease;
        background:
          radial-gradient(ellipse at 50% 115%, rgba(238, 242, 245, 0.98) 0%, rgba(226, 232, 238, 0.92) 28%, rgba(214, 222, 230, 0.7) 52%, rgba(200, 210, 220, 0) 78%),
          radial-gradient(ellipse at 50% 20%, rgba(232, 238, 243, 0.55), rgba(232, 238, 243, 0) 60%); }
      #fog.in { opacity: 1; }

      /* ---------------- 面板 ---------------- */
      #panel-root { position: fixed; inset: 0; z-index: 9; display: none;
        align-items: center; justify-content: center; background: rgba(3, 5, 9, 0.6); }
      #panel-root.open { display: flex; }
      .panel { box-sizing: border-box; width: min(600px, 92vw); max-height: 84vh; overflow-x: hidden; overflow-y: auto; padding: 26px 28px 22px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(18, 24, 34, 0.97), rgba(8, 11, 17, 0.99));
        background-clip: padding-box;
        border: 1px solid rgba(232, 201, 138, 0.22); color: #e6dfd0;
        font-family: "Songti SC", "STSong", "SimSun", serif;
        box-shadow: 0 30px 80px rgba(0,0,0,0.6); animation: pop 220ms ease;
        /* 滚动条接管：不接管的话 Chromium 默认浅色轨道会在右边露出一条白边 */
        scrollbar-width: thin; scrollbar-color: rgba(232, 201, 138, 0.38) transparent; }
      .panel::-webkit-scrollbar { width: 8px; }
      .panel::-webkit-scrollbar-track { background: transparent; }
      .panel::-webkit-scrollbar-thumb { background: rgba(232, 201, 138, 0.32); border-radius: 8px;
        border: 2px solid transparent; background-clip: padding-box; }
      .panel::-webkit-scrollbar-thumb:hover { background: rgba(232, 201, 138, 0.55); background-clip: padding-box; }
      .panel::-webkit-scrollbar-corner { background: transparent; }
      @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
      .panel.wide { width: min(880px, 96vw); }
      .panel-title { font-size: 21px; letter-spacing: 0.14em; color: #f5e7c6; }
      .panel-title span { display: block; margin-top: 6px; font-size: 11.5px; letter-spacing: 0.1em; color: rgba(226,216,196,.48); }
      .panel-text { font-size: 14.5px; line-height: 1.95; color: rgba(226, 217, 200, 0.72); margin-top: 8px; }
      .btn { cursor: pointer; border: 0; border-radius: 999px; padding: 10px 24px; margin-top: 16px;
        font-size: 13px; letter-spacing: 0.16em;
        font-family: -apple-system, "Microsoft YaHei", sans-serif; }
      .btn.gold { background: linear-gradient(180deg, #f3dcac, #ddba7c); color: #14181f; }
      .btn.ghost { background: transparent; color: #e8c98a; border: 1px solid rgba(232,201,138,.42);
        margin-left: 8px; }
      .btn[disabled] { opacity: 0.45; cursor: default; }

      .spirit-card { margin-top: 16px; padding: 16px 18px; border-radius: 10px;
        background: rgba(255,255,255,0.035); border: 1px solid rgba(232,201,138,.18); }
      .sc-root { font-size: 22px; color: #ffe6a8; letter-spacing: 0.16em; }
      .sc-meta { font-size: 12.5px; opacity: 0.72; margin-top: 8px; letter-spacing: 0.08em; }
      .sc-verdict { font-size: 13px; opacity: 0.85; margin-top: 10px; color: #cfc6b2; }

      .brew-bar { position: relative; height: 16px; margin: 22px 0 8px; border-radius: 8px; overflow: hidden;
        background: rgba(255,255,255,.06); border: 1px solid rgba(232,201,138,.16); }
      .brew-zone { position: absolute; top: 0; bottom: 0; background: rgba(255,206,120,.26); }
      .brew-marker { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #ffe6a8;
        box-shadow: 0 0 10px rgba(255,230,168,.9); }
      .shake { animation: shake .28s; }
      @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

      .swords { display: flex; gap: 10px; margin: 18px 0 4px; }
      .sword { flex: 1; cursor: pointer; padding: 16px 12px; border-radius: 10px; text-align: left;
        background: rgba(255,255,255,.03); border: 1px solid rgba(232,201,138,.2); color: #e6dfd0;
        font-family: inherit; transition: all 160ms ease; }
      .sword:hover { border-color: rgba(232,201,138,.7); background: rgba(232,201,138,.09); }
      .sword.picked { border-color: rgba(255,214,140,.8); background: rgba(255,214,140,.12); }
      .sword b { display: block; font-size: 16px; color: #f5e7c6; margin-bottom: 6px; letter-spacing: .1em; }
      .sword span { font-size: 12px; opacity: .7; line-height: 1.7; }

      .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px auto 6px;
        width: 100%; max-width: 400px; }
      .tile { aspect-ratio: 1.25; cursor: pointer; border-radius: 8px; font-size: 22px; color: #e8c98a;
        background: rgba(255,255,255,.035); border: 1px solid rgba(232,201,138,.18); transition: all 160ms ease; }
      .tile.flipped { background: rgba(255,255,255,.06); }
      .tile.relic { color: #ffe6a8; border-color: rgba(255,214,140,.75); background: rgba(255,214,140,.12); }


      /* 灵根属性条 */
      .bar { display: grid; grid-template-columns: 34px 1fr 26px; align-items: center; gap: 9px;
        font-size: 12.5px; color: rgba(226,217,200,.66); margin-top: 7px; letter-spacing: .08em; }
      .bar i { display: block; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; position: relative; }
      .bar i b { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: linear-gradient(90deg, rgba(232,201,138,.45), #f2dfb2); }
      .bar em { font-style: normal; text-align: right; opacity: .7; }
      .root { font-size: 24px; letter-spacing: .14em; }
      .meta { font-size: 12.5px; opacity: .72; margin-top: 8px; letter-spacing: .08em; line-height: 1.8; }
      .traits { margin-top: 12px; display: grid; gap: 6px; }
      .trait { font-size: 12.5px; color: rgba(232,222,204,.86); }
      .trait b { color: #f2dfb2; font-weight: 400; margin-right: 8px; letter-spacing: .1em; }
      .trait span { color: rgba(200,192,176,.62); }

      /* 剑冢锁定 */
      .sword.locked { opacity: .45; cursor: default; }

      /* 舆图上的「你在这里」 */
      .you { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
      .you-ring { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
        border-radius: 50%; border: 1px solid rgba(255,226,170,.85);
        box-shadow: 0 0 26px rgba(255,214,150,.4); animation: youpulse 2.4s ease-in-out infinite; }
      .you-dot { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
        border-radius: 50%; background: #fff3d2; box-shadow: 0 0 14px 4px rgba(255,226,170,.7); }
      .you-lab { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); white-space: nowrap;
        font-size: 11.5px; letter-spacing: .16em; color: #ffeccd; padding: 4px 10px; border-radius: 999px;
        background: rgba(10,14,21,.72); border: 1px solid rgba(232,201,138,.3); }
      @keyframes youpulse { 0%,100% { transform: scale(.86); opacity: .55 } 50% { transform: scale(1.12); opacity: 1 } }

      .pending { margin: 12px 0 0; padding-left: 20px; font-size: 13px; line-height: 2; opacity: 0.75; }
      .tb-rank { font-size: 30px; letter-spacing: .2em; color: #ffe6a8; margin: 18px 0 4px; }
      .tb-merit { font-size: 13px; letter-spacing: .18em; opacity: .8; }

      #toast { position: fixed; left: 50%; top: 20%; transform: translate(-50%, 8px); opacity: 0;
        z-index: 20; padding: 9px 22px; border-radius: 14px; background: rgba(10,14,21,.9);
        border: 1px solid rgba(232,201,138,.32); color: #ffe6a8; font-size: 13px; letter-spacing: .16em;
        max-width: min(78vw, 520px); text-align: center; line-height: 1.8; white-space: pre-line;
        transition: all 260ms ease; pointer-events: none; }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 680px) {
        #nav { gap: 2px; padding: 5px; }
        #nav button { padding: 6px 9px; }
        #nav button span { display: none; }
        .panel { max-height: 76vh; }
      }

      /* ---------- 入场动画 ---------- */
      #intro {
        position: fixed; inset: 0; z-index: 60;
        background: #05070b;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 900ms ease;
        cursor: pointer;
      }
      #intro.gone { opacity: 0; pointer-events: none; }
      #intro video {
        width: 100%; height: 100%; object-fit: contain;   /* 2.29:1 电影画幅，上下自动留黑边 */
        filter: saturate(0.94) contrast(1.06) brightness(0.96);
      }
      /* 上下压暗 + 四周暗角，让标题压得住画面 */
      .intro-shade {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 52%, rgba(0,0,0,0) 38%, rgba(3,5,9,0.72) 100%),
          linear-gradient(180deg, rgba(4,6,10,0.55) 0%, rgba(4,6,10,0) 26%, rgba(4,6,10,0) 70%, rgba(4,6,10,0.78) 100%);
      }
      .intro-title {
        position: absolute; left: 0; right: 0; bottom: 20%;
        text-align: center; pointer-events: none;
        opacity: 0; transform: translateY(10px);
        animation: introTitle 2600ms ease 900ms forwards;
      }
      @keyframes introTitle {
        to { opacity: 1; transform: translateY(0); }
      }
      .it-cn {
        font-family: "Songti SC", "STSong", "SimSun", serif;
        font-size: clamp(38px, 6vw, 76px); letter-spacing: 0.34em; text-indent: 0.34em;
        color: #f4e6c8;
        text-shadow: 0 2px 26px rgba(0,0,0,0.85), 0 0 60px rgba(255,214,150,0.25);
      }
      .it-line {
        width: 120px; height: 1px; margin: 18px auto;
        background: linear-gradient(90deg, transparent, rgba(232,201,138,0.85), transparent);
      }
      .it-sub {
        font-size: clamp(11px, 1.2vw, 14px); letter-spacing: 0.5em; text-indent: 0.5em;
        color: rgba(232,201,138,0.82);
      }
      #intro-skip {
        position: absolute; right: 26px; bottom: 24px; z-index: 2;
        padding: 8px 18px; border-radius: 999px;
        background: rgba(8,11,17,0.55); border: 1px solid rgba(232,201,138,0.28);
        color: rgba(240,224,190,0.9); font-size: 13px; letter-spacing: 0.12em;
        cursor: pointer; transition: all 200ms ease;
      }
      #intro-skip:hover { border-color: rgba(232,201,138,0.7); color: #ffe6a8; }
      /* ---------------- 人物 / 账本 / 袋子 / 事件卡 ---------------- */
      #hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
      #hud-line { display: flex; gap: 14px; font-size: 12.5px; opacity: 0.9; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
      #hud-line #r-left.warn { color: #e8a08a; }
      #hud-line #r-left.warn::after { content: " 大限将至"; font-size: 10px; opacity: 0.8; letter-spacing: 0.1em; }
      #hud-line #r-left.crit { color: #e0705c; animation: critPulse 1.6s ease-in-out infinite; }
      #hud-line #r-left.crit::after { content: " 只剩这些年了"; }
      @keyframes critPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      #hud-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 54vw; }
      #hud-btns button {
        background: rgba(8, 11, 17, 0.5); border: 1px solid rgba(232, 201, 138, 0.22);
        color: rgba(240, 224, 190, 0.82); font-family: inherit; font-size: 11.5px;
        letter-spacing: 0.18em; padding: 4px 12px; border-radius: 999px; cursor: pointer;
        transition: all 180ms ease; }
      #hud-btns button:hover { border-color: rgba(232, 201, 138, 0.7); color: #ffe6a8; }
      #hud-btns button .mind-n {
        display: inline-block; margin-left: 5px; min-width: 15px; padding: 0 3px;
        font-size: 10px; line-height: 15px; letter-spacing: 0; border-radius: 999px;
        background: rgba(232, 201, 138, 0.18); color: rgba(240, 224, 190, 0.75); }
      #hud-btns button .mind-n.hot {
        background: rgba(232, 201, 138, 0.9); color: #14100a; font-weight: 700; }

      .relic-line {
        margin-top: 12px; padding: 8px 12px; border-left: 2px solid rgba(232, 201, 138, 0.28);
        font-size: 12px; line-height: 1.9; color: rgba(210, 200, 184, 0.6); font-style: italic; }

      .ask-from { margin: 10px 0; font-size: 12px; line-height: 1.9; color: rgba(240, 215, 154, 0.78); }
      .ask-q { margin: 6px 0 14px; font-size: 17px; letter-spacing: 0.1em; color: #f5e7c6; }
      .ask-opts { display: flex; flex-direction: column; gap: 8px; }

      .dirs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
      .dir {
        padding: 16px 0; border-radius: 10px; cursor: pointer; font-family: inherit;
        font-size: 16px; letter-spacing: 0.2em; color: #f0e0be;
        background: rgba(232, 201, 138, 0.05); border: 1px solid rgba(232, 201, 138, 0.2);
        transition: all 160ms ease; }
      .dir:hover { background: rgba(232, 201, 138, 0.14); border-color: rgba(232, 201, 138, 0.6); }

      .scrolls { display: flex; flex-direction: column; gap: 9px; margin: 14px 0; }
      .scroll {
        text-align: left; padding: 12px 14px; border-radius: 10px; cursor: pointer; font-family: inherit;
        background: rgba(232, 201, 138, 0.04); border: 1px solid rgba(232, 201, 138, 0.18);
        color: rgba(226, 217, 200, 0.8); transition: all 160ms ease; }
      .scroll:hover { background: rgba(232, 201, 138, 0.1); border-color: rgba(232, 201, 138, 0.5); }
      .scroll b { display: block; font-size: 13.5px; letter-spacing: 0.16em; color: #f2dfb2; font-weight: 400; }
      .scroll span { display: block; font-size: 11.5px; line-height: 1.85; opacity: 0.55; margin-top: 5px; }
      .scroll.done { opacity: 0.45; }

      .scroll-body { margin: 18px 0 6px; }
      .scroll-body p {
        margin: 0 0 14px; font-size: 17px; letter-spacing: 0.12em; color: #ece0c6;
        opacity: 0; animation: inkIn 900ms ease forwards; }
      @keyframes inkIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

      .bio-line {
        margin: 16px 0 18px; font-size: 18.5px; line-height: 1.95; letter-spacing: 0.06em;
        color: #f5e7c6; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); }
      .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
      .f4 { padding: 10px 11px; border-radius: 9px; background: rgba(232, 201, 138, 0.04);
        border: 1px solid rgba(232, 201, 138, 0.12); }
      .f4 b { display: block; font-size: 11.5px; letter-spacing: 0.22em; opacity: 0.5; font-weight: 400; }
      .f4 em { display: block; font-style: normal; font-size: 17px; color: #f2dfb2; margin: 4px 0 2px; }
      .f4 span { display: block; font-size: 11.5px; opacity: 0.55; line-height: 1.6; }
      .bio-sec { margin: 18px 0 8px; font-size: 12px; letter-spacing: 0.28em;
        color: rgba(232, 201, 138, 0.55); border-bottom: 1px solid rgba(232, 201, 138, 0.1); padding-bottom: 6px; }

      /* 用掉的那一刻：半秒钟，不要面板，不要按钮 */

        12% { opacity: 1; transform: none; }
        66% { opacity: 1; }
        100% { opacity: 0; transform: translateY(30px) scale(1.04); }
      }
      .lifefx-vig { position: fixed; inset: 0; z-index: 65; pointer-events: none;
        background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(160,22,10,.45));
        animation: lifefxVig 1.15s ease-out forwards; }
      @keyframes lifefxVig { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }
      @media (max-width: 720px) { .lifefx-num { left: 20px; top: 172px; font-size: 24px; } }
      @media (max-width: 720px) {
        #vitalcard { top: 56px; padding: 8px 12px 9px; width: 216px; }
        .vc-name { font-size: 17px; }
        #vc-avatar { width: 42px; height: 50px; }
        .vc-main { min-width: 108px; }
      }

      /* 灵根小卡（人物面板） */
      .spirit-mini { margin: 6px 0 10px; padding: 12px 14px; border: 1px solid rgba(232,201,138,.18);
        border-radius: 8px; background: linear-gradient(180deg, rgba(232,201,138,.05), rgba(232,201,138,.01)); }
      .sm-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
      .sm-head b { font-size: 17px; letter-spacing: .08em; color: #f5e7c6; }
      .sm-head em { font-style: normal; font-size: 11px; letter-spacing: .18em; color: #e8c98a; opacity: .85; }
      .sm-row { font-size: 13.5px; line-height: 1.95; color: rgba(217,211,198,.78); letter-spacing: .04em; }

      .npc-col { flex: 0 0 210px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
      .npc-art { width: 100%; max-height: 320px; object-fit: contain;
        filter: drop-shadow(0 14px 26px rgba(0,0,0,.55)); animation: npcIn .4s ease-out; }
      .npc-name { margin-top: 10px; text-align: center; font-size: 13px; letter-spacing: .14em; color: #f0dfb6; }
      .npc-name span { display: block; margin-top: 3px; font-size: 10px; letter-spacing: .12em; color: rgba(232,201,138,.45); }
      .npc-txt { flex: 1 1 auto; min-width: 0; }
      @keyframes npcIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
      @media (max-width: 720px) {
        .panel.with-npc { flex-direction: column; gap: 10px; }
        .npc-col { flex: 0 0 auto; }
        .npc-art { max-height: 150px; }
        /* 手机宽度：按钮不许把"灵墟"挤出去，宁可换行 */
        #hud { gap: 10px; }
        #hud-btns { flex-wrap: wrap; justify-content: flex-end; max-width: 62vw; }
        #hud-btns button { padding: 3px 9px; font-size: 10.5px; letter-spacing: 0.1em; }
        #hud-line { font-size: 11px; gap: 6px; }
        #merit { font-size: 11px; }
      }

      /* 走到那儿，他叫住你 */
      #mind-call { position: fixed; left: 50%; bottom: 108px; transform: translate(-50%, 12px);
        width: min(420px, calc(100vw - 40px)); z-index: 8; opacity: 0; pointer-events: none;
        padding: 16px 18px 14px; border-radius: 12px;
        background: linear-gradient(180deg, rgba(20,26,36,.96), rgba(12,16,24,.96));
        border: 1px solid rgba(232,201,138,.34); box-shadow: 0 18px 48px rgba(0,0,0,.62);
        transition: opacity .3s ease, transform .3s ease; }
      #mind-call.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      .mc-who { font-size: 12px; letter-spacing: .16em; color: #e8c98a; }
      .mc-who i { font-style: normal; opacity: .55; margin-left: 9px; font-size: 11px; letter-spacing: .08em; }
      .mc-line { margin-top: 9px; font-size: 14px; line-height: 1.9; color: rgba(236,226,208,.9); }
      .mc-acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 13px; }
      .mc-acts .btn { margin: 0; padding: 7px 17px; font-size: 12px; }
      @media (max-width: 700px) {
        #mind-call { bottom: 92px; padding: 13px 15px 12px; }
        .mc-line { font-size: 13px; }
      }

      /* ------------------------- 左侧人物栏 ------------------------- */
      #people-rail { position: fixed; left: 0; top: 170px; bottom: 84px; width: 198px; z-index: 7;
        display: flex; flex-direction: column; transition: transform .28s ease;
        background: linear-gradient(90deg, rgba(8,11,17,.94), rgba(8,11,17,.70));
        border-right: 1px solid rgba(232,201,138,.16); }
      body.rail-closed #people-rail { transform: translateX(-198px); }
      #people-toggle { position: fixed; left: 198px; top: 170px; z-index: 8;
        padding: 5px 9px; font-size: 11px; letter-spacing: .12em; cursor: pointer;
        color: #e8c98a; background: rgba(10,14,21,.9); border: 1px solid rgba(232,201,138,.28);
        border-left: 0; border-radius: 0 6px 6px 0; transition: left .28s ease; }
      body.rail-closed #people-toggle { left: 0; }
      .pr-head { padding: 12px 12px 9px; font-size: 12px; letter-spacing: .18em; color: #f0d79a;
        border-bottom: 1px solid rgba(232,201,138,.16); }
      .pr-head em { font-style: normal; float: right; font-size: 10px; opacity: .6; letter-spacing: .08em; }
      #people-list { flex: 1; overflow-y: auto; scrollbar-width: thin; }
      .pr-item { display: flex; gap: 8px; align-items: center; padding: 7px 10px; cursor: pointer;
        border-bottom: 1px solid rgba(255,255,255,.045); border-left: 2px solid transparent; }
      .pr-item:hover { background: rgba(232,201,138,.08); }
      .pr-item.hot { border-left-color: #e8c98a; background: rgba(232,201,138,.05); }
      .pr-item.dim { opacity: .42; }
      .pr-item.gone { opacity: .35; filter: grayscale(1); }
      .pr-face { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; object-fit: cover;
        object-position: center 20%; background: rgba(255,255,255,.06); border: 1px solid rgba(232,201,138,.22); }
      .pr-face.noart { display: grid; place-items: center; font-size: 12px; color: #e8c98a; }
      .pr-txt { min-width: 0; flex: 1; }
      .pr-name { font-size: 12px; color: #eee4d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pr-sub { font-size: 10px; opacity: .58; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pr-badge { font-size: 10px; padding: 1px 5px; border-radius: 999px; flex: 0 0 auto;
        color: #14181f; background: #e8c98a; }
      .pr-badge.gray { background: rgba(255,255,255,.16); color: #e2d8c8; }
      .pr-foot { padding: 8px 12px; font-size: 10px; opacity: .42; border-top: 1px solid rgba(232,201,138,.12); }
      @media (max-width: 900px) {
        #people-rail { top: 158px; width: 168px; }
        body.rail-closed #people-rail { transform: translateX(-168px); }
        #people-toggle { left: 168px; top: 158px; }
      }

      /* ------------------------- 人物卡 ------------------------- */
      .pp-head { display: flex; gap: 16px; margin-top: 10px; }
      .pp-art { width: 116px; height: 152px; flex: 0 0 116px; object-fit: cover; object-position: center 18%;
        border-radius: 8px; border: 1px solid rgba(232,201,138,.26); background: rgba(255,255,255,.04); }
      .pp-art.noart { display: grid; place-items: center; font-size: 30px; color: rgba(232,201,138,.5); }
      .pp-title { font-size: 19px; color: #f5e7c6; letter-spacing: .12em; }
      .pp-role { font-size: 11.5px; opacity: .6; margin-top: 4px; letter-spacing: .1em; }
      .pp-intro { font-size: 13.5px; line-height: 1.9; color: rgba(236,226,208,.82); margin-top: 10px; }
      .pp-tags { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
      .pp-tags span { font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
        color: rgba(232,201,138,.85); border: 1px solid rgba(232,201,138,.26); }
      .pp-bar { margin-top: 12px; }
      .pp-bar i { display: block; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); position: relative; }
      .pp-bar i b { position: absolute; inset: 0 auto 0 0; border-radius: 3px;
        background: linear-gradient(90deg, rgba(232,201,138,.5), #ffe6a8); }
      .pp-bar small { display: block; margin-top: 5px; font-size: 10.5px; opacity: .55; }
      .pp-sec { margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(232,201,138,.14); }
      .pp-sec h4 { margin: 0 0 7px; font-size: 11px; letter-spacing: .16em; color: #e8c98a; font-weight: 400; }
      .pp-bio p { font-size: 12.5px; line-height: 1.9; color: rgba(226,217,200,.74); margin: 0 0 5px; }
      .pp-bio p.locked { opacity: .3; }
      .pp-acts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
      .pp-acts .btn { margin: 0; padding: 8px 15px; font-size: 11.5px; }
      .pp-gifts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 8px; }
      .pp-gift { padding: 8px 4px; font-size: 11px; text-align: center; cursor: pointer; border-radius: 8px;
        color: #e6dfd0; background: rgba(255,255,255,.035); border: 1px solid rgba(232,201,138,.18); }
      .pp-gift:hover { border-color: rgba(232,201,138,.7); background: rgba(232,201,138,.09); }
      .pp-gift[disabled] { opacity: .3; cursor: default; }
      .pp-gift b { display: block; font-size: 13px; color: #f2dfb2; font-weight: 400; }
      .pp-mind { font-size: 12px; line-height: 1.9; color: rgba(226,217,200,.72); }
      .pp-mind b { color: #f2dfb2; font-weight: 400; }
      .pp-line { margin-top: 8px; padding: 9px 12px; border-left: 2px solid rgba(232,201,138,.4);
        font-size: 13px; line-height: 1.85; color: #f2dfb2; background: rgba(255,255,255,.03); }

      /* ================== 体验精修：信息层级 / 反馈 / 可读性 ================== */
      /* 年度抉择：三张等价的牌。不给任何一张"推荐色"，选哪张由玩家自己定。 */
      .yc-panel .ev-title { margin-bottom: 6px; }
      .yc-sub { font-size: 11.5px; line-height: 1.9; letter-spacing: .06em; opacity: .46;
        margin: 0 auto 16px; max-width: 420px; }
      .yc-opts { gap: 9px; text-align: left; }
      .yc-card { box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px;
        padding: 10px 14px; border-radius: 10px; cursor: pointer; text-align: left;
        font-family: "Songti SC", "STSong", "SimSun", serif; color: #ece0c6;
        background: rgba(255,255,255,.032); border: 1px solid rgba(232,201,138,.18);
        border-left: 2px solid rgba(232,201,138,.34);
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease; }
      .yc-card:hover, .yc-card:focus-visible { transform: translateX(3px); outline: none;
        border-color: rgba(232,201,138,.62); border-left-color: #f0d79a;
        background: rgba(232,201,138,.085); }
      .yc-card.live { border-left-color: rgba(159,216,189,.85); }
      .yc-card.live:hover, .yc-card.live:focus-visible { border-left-color: #9fd8bd; }
      .yc-no { flex: 0 0 26px; width: 26px; height: 26px; display: grid; place-items: center;
        border-radius: 50%; font-size: 12px; color: rgba(232,201,138,.82);
        border: 1px solid rgba(232,201,138,.3); background: rgba(232,201,138,.06); }
      .yc-card.live .yc-no { color: #9fd8bd; border-color: rgba(159,216,189,.45); background: rgba(159,216,189,.07); }
      .yc-main { flex: 1 1 auto; min-width: 0; }
      .yc-main b { display: block; font-size: 14px; font-weight: 400; letter-spacing: .1em; color: #f5e7c6;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .yc-main em { display: block; font-style: normal; font-size: 11px; line-height: 1.6; margin-top: 3px;
        opacity: .45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .yc-card .ev-chip { flex: 0 0 auto; max-width: 38%; margin-left: 0; font-size: 10.5px;
        letter-spacing: .04em; opacity: .72; color: #e8c98a; text-align: right;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .yc-card .ev-chip::before { content: ''; }
      @media (max-width: 680px) {
        .yc-card { gap: 8px; padding: 9px 10px; }
        .yc-card .ev-chip { max-width: 34%; font-size: 9.5px; }
        .yc-main b { font-size: 13px; }
      }

      /* 年结：花掉一年换来了什么，逐条看见，不塞进胶囊 */
      #year-result { position: fixed; left: 50%; top: 22%; transform: translate(-50%, 10px);
        z-index: 21; width: min(430px, 88vw); padding: 15px 18px 11px; border-radius: 12px;
        opacity: 0; pointer-events: none; cursor: pointer;
        background: linear-gradient(180deg, rgba(20,26,36,.97), rgba(10,14,21,.97));
        border: 1px solid rgba(232,201,138,.34); box-shadow: 0 20px 54px rgba(0,0,0,.66);
        transition: opacity .28s ease, transform .28s ease; }
      #year-result.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      /* 玩家点开了别的面板，年结就别浮在人脸上（底栏也是这么让位的） */
      body:has(#panel-root.open) #year-result { opacity: 0; pointer-events: none; }
      .yr-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 9px;
        border-bottom: 1px solid rgba(232,201,138,.16); }
      .yr-head span { font-size: 10.5px; letter-spacing: .18em; color: rgba(232,201,138,.62); }
      .yr-head b { font-size: 14px; font-weight: 400; letter-spacing: .12em; color: #f2dfb2; }
      .yr-lines { margin-top: 9px; }
      .yr-line { font-size: 12.5px; line-height: 1.95; letter-spacing: .04em;
        color: rgba(226,217,200,.72); padding-left: 12px; position: relative; }
      .yr-line::before { content: '·'; position: absolute; left: 1px; color: rgba(232,201,138,.5); }
      .yr-line.first { color: #f2dfb2; }
      .yr-foot { margin-top: 10px; text-align: right; font-size: 10px; letter-spacing: .12em; opacity: .34; }

      /* 人物栏：谁在等你，一眼看见；没见过和已不在，不能都是"变灰" */
      .pr-stat { padding: 7px 12px 8px; font-size: 10.5px; letter-spacing: .04em;
        color: rgba(233,226,208,.78); border-bottom: 1px solid rgba(232,201,138,.1); }
      .pr-stat b { font-weight: 400; color: #f0d79a; font-size: 11.5px; }
      #people-list::-webkit-scrollbar { width: 6px; }
      #people-list::-webkit-scrollbar-track { background: transparent; }
      #people-list::-webkit-scrollbar-thumb { background: rgba(232,201,138,.26); border-radius: 8px; }
      .pr-item.dim { opacity: .68; border-left-style: dashed; border-left-color: rgba(255,255,255,.13); }
      .pr-item.dim .pr-name { opacity: .72; }
      .pr-item.gone .pr-name { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
      .pr-badge.ready { background: #f0d79a; color: #14181f; }
      .pr-badge.task { background: rgba(159,216,189,.9); color: #0f1a16; }
      .pr-badge.party { background: rgba(159,216,189,.14); color: #9fd8bd;
        border: 1px solid rgba(159,216,189,.42); }
      #people-toggle:focus-visible { outline: 1px solid #f0d79a; outline-offset: 2px; }

      /* 人物卡：亲疏的"下一档在哪"要看得见，赠礼的喜好要标在按钮上 */
      .pp-bar i { overflow: visible; }
      .pp-tick { position: absolute; top: -2px; width: 2px; height: 9px; border-radius: 1px;
        background: rgba(255,255,255,.3); transform: translateX(-1px); }
      .pp-tick.on { background: #f0d79a; box-shadow: 0 0 6px rgba(240,215,154,.55); }
      .pp-acts .btn.main { border-color: rgba(232,201,138,.72); background: rgba(232,201,138,.08); color: #f5e7c6; }
      .pp-acts .btn.main:hover { background: rgba(232,201,138,.17); }
      .pp-hint { margin-top: 8px; font-size: 11px; letter-spacing: .06em; color: rgba(159,216,189,.72); }
      .pp-gift { position: relative; font-family: inherit; }
      .pp-gift small { display: block; font-size: 10px; opacity: .55; margin-top: 2px; }
      .pp-gift em { position: absolute; top: -6px; right: -4px; font-style: normal;
        font-size: 9px; letter-spacing: .04em; padding: 1px 5px; border-radius: 999px; }
      .pp-gift em.like { color: #0f1a16; background: #9fd8bd; }
      .pp-gift em.hate { color: #24100c; background: #e0a08a; }

      /* 键盘可达 + 尊重系统的"减少动效" */
      button:focus-visible, [role="button"]:focus-visible { outline: 1px solid rgba(232,201,138,.85); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        .yc-card, #year-result, #people-rail, #people-toggle, #dock-next, #toast { transition: none !important; animation: none !important; }
        .yc-card:hover, .yc-card:focus-visible { transform: none; }
      }
</style>
  </head>
  <body>
    <a id="back-map" class="back-map" href="#" hidden>‹ 回舆图</a>
    <div id="map-dock" hidden>
      <div class="dock-card">
        <div class="dock-goal"><b id="dock-rank">练气</b><span id="dock-left">寿元 64</span></div>
        <div class="dock-sep"></div>
        <div class="dock-goal"><span>渡劫四事</span><span class="dock-dots" id="dock-dots"></span></div>
        <div class="dock-sep"></div>
        <div id="dock-next" role="button" tabindex="0" title="点一下，去下一步该去的地方"><span id="dock-next-label">下一步</span><small id="dock-next-sub"></small></div>
      </div>
      <button id="btn-year">静修一年</button>
      <button id="walk-out" hidden>出门走走 · 一年</button>
    </div>

    <div id="stage"><div id="bg" class="empty"></div><div id="spots"></div></div>
    <div id="grade"></div>
    <div id="hud">
      <div>
        <div class="cn">灵墟</div>
        <div class="en">LINGXU · 仙途</div>
      </div>
      <div id="hud-right">
        <div id="hud-line"><span id="r-age">年 16</span><span id="r-left">寿元 80</span></div>
        <div id="merit">道行 0 · 练气</div>
        <div id="hud-btns">
          <button id="btn-bio">人物</button>
          <button id="btn-mind">心事</button>
          <button id="btn-bag">袋子</button>
          <button id="btn-sect">宗门</button>
          <button id="btn-travel">出门</button>
          <button id="btn-world">天时</button>
          <button id="btn-folk">人</button>
          <button id="btn-break">破境</button>
          <button id="btn-mount">坐骑</button>
          <button id="btn-codex">图鉴</button>
          <button id="btn-archive">命簿</button>
        </div>
      </div>
    </div>
    <!-- 左上角：像素头像 + 气血 + 年岁 -->
    <div id="vitalcard">
      <div class="vc-row">
        <div id="vc-avatar"></div>
        <div class="vc-main">
          <div class="vc-name" id="vc-name">无名</div>
          <div class="vc-sub"><span id="vc-root">尚未测灵根</span><i>·</i><span id="vc-rank">练气</span></div>
        </div>
      </div>
      <div class="vc-hp"><i id="vc-hpbar"></i></div>
      <div class="vc-bot"><span id="vc-hp">— / —</span><em id="vc-year">年 16</em></div>
    </div>
    <div id="prompt"></div>
    <div id="nav"></div>
    <div id="panel-root"></div>
    <div id="fog"></div>

    <!-- 入场动画：山门石阶·第一人称推进（已去水印，H.264） -->
    <div id="intro">
      <video id="intro-video" muted playsinline preload="auto"
             poster="./assets/video/intro-a-poster.jpg?v=2" src="./assets/video/intro-a.mp4?v=2"></video>
      <div class="intro-shade"></div>
      <div class="intro-title">
        <div class="it-cn">灵墟</div>
        <div class="it-line"></div>
        <div class="it-sub">入此墟者 · 各凭灵根</div>
      </div>
      <button id="intro-skip">跳过 ▸</button>
    </div>

    <div id="toast"></div>
    <!-- 年结：这一格换来了什么 -->
    <div id="year-result"></div>
    <!-- 场景里被人叫住：不打断探索，也不弹大面板 -->
    <div id="mind-call">
      <div class="mc-who" id="mc-who"></div>
      <div class="mc-line" id="mc-line"></div>
      <div class="mc-acts" id="mc-acts"></div>
    </div>

    <!-- 左边这一栏：有关系、有托付的人排在前头 -->
    <button id="people-toggle" type="button" aria-expanded="true" aria-controls="people-rail">人物 ‹</button>
    <aside id="people-rail">
      <div class="pr-head">人物 <em id="pr-party"></em></div>
      <div class="pr-stat" id="pr-stat"></div>
      <div id="people-list"></div>
      <div class="pr-foot">点一个人，看看他是谁</div>
    </aside>
    <script type="module" src="./scenes.js"></script>
  </body>
</html>
